name: Hardening Audit

on:
  push:
    branches: ["release/hardening"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development tools
        run: pip install -e ".[dev]"
      - name: Capture hardening diagnostics
        shell: bash
        run: |
          mkdir -p .hardening
          set +e
          {
            echo "# Nova-Arsenal hardening audit"
            echo
            echo "commit: $GITHUB_SHA"
            echo
            echo "## Ruff lint"
            ruff check .
            echo "ruff_exit=$?"
            echo
            echo "## Ruff formatting"
            ruff format --check .
            echo "format_exit=$?"
            echo
            echo "## BasedPyright"
            basedpyright nova_arsenal/
            echo "type_exit=$?"
          } > .hardening/audit.txt 2>&1
          exit 0
      - name: Commit diagnostics to the hardening branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .hardening/audit.txt
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
          else
            git commit -m "chore(hardening): capture static analysis"
            git push
          fi
