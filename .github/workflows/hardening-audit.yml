name: Hardening Audit

on:
  push:
    branches: ["release/hardening"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  safe-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development tools
        run: pip install -e ".[dev]"
      - name: Apply guarded Ruff safe fixes and test
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path

          path = Path("nova_arsenal/agent_runner.py")
          text = path.read_text()
          old = """{chr(10).join(f'  [{f.severity.upper()}] {f.title} (sources: {\", \".join(f.source_tools)})' for f in cr.correlated_findings[:5]) if cr.correlated_findings else '  None'}"""
          new = """{chr(10).join('  [{}] {} (sources: {})'.format(f.severity.upper(), f.title, ", ".join(f.source_tools)) for f in cr.correlated_findings[:5]) if cr.correlated_findings else '  None'}"""
          if old not in text:
              raise SystemExit("Expected correlation f-string not found")
          path.write_text(text.replace(old, new, 1))
          PY

          ruff check . --fix > /tmp/ruff-fix.txt 2>&1
          RUFF_EXIT=$?
          git diff --check >> /tmp/ruff-fix.txt 2>&1
          pytest -q > /tmp/pytest.txt 2>&1
          TEST_EXIT=$?

          if [ "$TEST_EXIT" -ne 0 ]; then
            git restore .
            mkdir -p .hardening
            {
              echo "# Guarded cleanup regression report"
              echo
              echo "The guarded Ruff cleanup failed tests, so no source cleanup was committed."
              echo
              echo "## Test output"
              cat /tmp/pytest.txt
              echo
              echo "## Ruff output (exit $RUFF_EXIT)"
              cat /tmp/ruff-fix.txt
            } > .hardening/test-failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .hardening/test-failure.txt
            git commit -m "chore(hardening): record guarded cleanup regression"
            git push
            exit 0
          fi

          rm -f .hardening/test-failure.txt
          mkdir -p .hardening
          ruff check . --output-format=json > /tmp/ruff.json
          ruff format --check . > /tmp/format.txt 2>&1
          basedpyright nova_arsenal/ --outputjson > /tmp/pyright.json 2>/tmp/pyright.stderr
          python - <<'PY'
          import collections
          import json
          from pathlib import Path

          lines = ["# Nova-Arsenal hardening summary", ""]
          try:
              ruff = json.loads(Path("/tmp/ruff.json").read_text())
          except Exception as exc:
              ruff = []
              lines.append(f"Ruff JSON parse failed: {exc}")
          lines.append(f"## Ruff\nDiagnostics: {len(ruff)}")
          by_code = collections.Counter(item.get("code") or "unknown" for item in ruff)
          by_file = collections.Counter(Path(item.get("filename", "unknown")).as_posix() for item in ruff)
          lines.append("\nTop rules:")
          for key, count in by_code.most_common(20):
              lines.append(f"- {key}: {count}")
          lines.append("\nTop files:")
          for key, count in by_file.most_common(25):
              lines.append(f"- {key}: {count}")

          fmt = Path("/tmp/format.txt").read_text(errors="replace").strip()
          lines.extend(["", "## Ruff format", fmt[:3000] or "No format output."])

          try:
              pyright = json.loads(Path("/tmp/pyright.json").read_text())
          except Exception as exc:
              pyright = {}
              lines.extend(["", f"BasedPyright JSON parse failed: {exc}"])
          summary = pyright.get("summary", {})
          diagnostics = pyright.get("generalDiagnostics", [])
          lines.extend([
              "",
              "## BasedPyright",
              f"Errors: {summary.get('errorCount', 'unknown')}",
              f"Warnings: {summary.get('warningCount', 'unknown')}",
              f"Information: {summary.get('informationCount', 'unknown')}",
          ])
          by_rule = collections.Counter(d.get("rule") or "unknown" for d in diagnostics)
          by_file = collections.Counter(Path(d.get("file", "unknown")).as_posix() for d in diagnostics)
          lines.append("\nTop rules:")
          for key, count in by_rule.most_common(25):
              lines.append(f"- {key}: {count}")
          lines.append("\nTop files:")
          for key, count in by_file.most_common(30):
              lines.append(f"- {key}: {count}")
          Path(".hardening/summary.txt").write_text("\n".join(lines) + "\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(hardening): apply tested Ruff safe fixes"
          git push