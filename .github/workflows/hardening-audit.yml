name: Hardening Audit

on:
  push:
    branches: ["release/hardening"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  low-risk-lint-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development tools
        run: pip install -e ".[dev]"
      - name: Apply low-risk lint fixes
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "nova_arsenal/auth/cleanup.py": [
                  ("ApiKey.is_active == True", "ApiKey.is_active.is_(True)"),
              ],
              "nova_arsenal/auth/middleware.py": [
                  ("ApiKey.is_active == True", "ApiKey.is_active.is_(True)"),
              ],
              "nova_arsenal/auth/routes.py": [
                  ("User.is_active == True", "User.is_active.is_(True)"),
                  ("ApiKey.is_active == True", "ApiKey.is_active.is_(True)"),
              ],
              "nova_arsenal/data_generation/core.py": [
                  ("weights = [dist[l] for l in levels]", "weights = [dist[level] for level in levels]"),
              ],
              "nova_arsenal/training/glm_agentic_rl.py": [
                  (
                      "max_deviation = max(abs(l - avg_load) / avg_load for l in loads)",
                      "max_deviation = max(abs(load - avg_load) / avg_load for load in loads)",
                  ),
              ],
              "alembic/env.py": [
                  (
                      "from nova_arsenal.db.models import Base\n",
                      "from nova_arsenal.db.models import Base  # noqa: E402\n",
                  ),
              ],
              "nova_arsenal/prompt_builder.py": [
                  (
                      "import logging\nfrom dataclasses import dataclass, field\nfrom enum import Enum\nfrom typing import Any, Union",
                      "import json\nimport logging\nfrom dataclasses import dataclass, field\nfrom enum import Enum\nfrom typing import Any",
                  ),
                  (
                      "PromptNode = Union[Scope, First, Empty, Isolate, Text, ChatMessage, ToolDefinition, ChainOfThought, AdaptiveThinking]",
                      "PromptNode = Scope | First | Empty | Isolate | Text | ChatMessage | ToolDefinition | ChainOfThought | AdaptiveThinking",
                  ),
                  ("\n\nimport json\n", "\n"),
              ],
              "nova_arsenal/mcp/server.py": [
                  (
                      "from mcp import MCPServer, Prompt, Resource, TextContent, Tool",
                      "from mcp import MCPServer, Resource, Tool",
                  ),
              ],
              "tests/integration/__init__.py": [
                  ("\nimport pytest\n", "\n"),
              ],
              "tests/unit/__init__.py": [
                  ("\nimport pytest\n", "\n"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {filename}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

          ruff check . --select F401,UP007
          git diff --check
          pytest -q
      - name: Capture remaining diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p .hardening
          ruff check . --output-format=json > /tmp/ruff.json
          basedpyright nova_arsenal/ --outputjson > /tmp/pyright.json 2>/tmp/pyright.stderr
          python - <<'PY'
          import collections
          import json
          from pathlib import Path

          ruff = json.loads(Path("/tmp/ruff.json").read_text())
          pyright = json.loads(Path("/tmp/pyright.json").read_text())
          lines = ["# Nova-Arsenal hardening detail", "", f"Ruff diagnostics: {len(ruff)}", ""]
          for item in ruff:
              loc = item.get("location", {})
              path = Path(item.get("filename", "unknown")).as_posix()
              fix = item.get("fix") or {}
              applicability = fix.get("applicability", "none") if isinstance(fix, dict) else "none"
              lines.append(
                  f"- {item.get('code')} {path}:{loc.get('row', '?')} "
                  f"[{applicability}] {item.get('message', '')}"
              )

          summary = pyright.get("summary", {})
          diagnostics = pyright.get("generalDiagnostics", [])
          lines.extend([
              "",
              "## BasedPyright",
              f"Errors: {summary.get('errorCount', 'unknown')}",
              f"Warnings: {summary.get('warningCount', 'unknown')}",
              "",
          ])
          by_file = collections.defaultdict(list)
          for d in diagnostics:
              by_file[Path(d.get("file", "unknown")).as_posix()].append(d)
          for path, entries in sorted(by_file.items(), key=lambda kv: (-len(kv[1]), kv[0])):
              lines.append(f"### {path} ({len(entries)})")
              for d in entries[:25]:
                  start = d.get("range", {}).get("start", {})
                  line = int(start.get("line", 0)) + 1
                  message = " ".join(str(d.get("message", "")).split())[:260]
                  lines.append(f"- L{line} [{d.get('rule', 'unknown')}] {message}")
              lines.append("")
          Path(".hardening/detail.txt").write_text("\n".join(lines) + "\n")
          PY
      - name: Commit tested lint cleanup and diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(hardening): apply low-risk lint cleanup"
            git push
          fi
