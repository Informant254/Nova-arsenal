name: Hardening Audit

on:
  push:
    branches: ["release/hardening"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development tools
        run: pip install -e ".[dev]"
      - name: Capture compact hardening diagnostics
        shell: bash
        run: |
          mkdir -p .hardening
          set +e
          ruff check . --output-format=json > /tmp/ruff.json
          ruff format --check . > /tmp/format.txt 2>&1
          basedpyright nova_arsenal/ --outputjson > /tmp/pyright.json 2>/tmp/pyright.stderr
          python - <<'PY'
          import collections
          import json
          from pathlib import Path

          lines = ["# Nova-Arsenal hardening summary", ""]

          try:
              ruff = json.loads(Path("/tmp/ruff.json").read_text())
          except Exception as exc:
              ruff = []
              lines.append(f"Ruff JSON parse failed: {exc}")

          lines.append(f"## Ruff\nDiagnostics: {len(ruff)}")
          by_code = collections.Counter(item.get("code") or "unknown" for item in ruff)
          by_file = collections.Counter(Path(item.get("filename", "unknown")).as_posix() for item in ruff)
          lines.append("\nTop rules:")
          for key, count in by_code.most_common(20):
              lines.append(f"- {key}: {count}")
          lines.append("\nTop files:")
          for key, count in by_file.most_common(25):
              lines.append(f"- {key}: {count}")

          fmt = Path("/tmp/format.txt").read_text(errors="replace").strip()
          lines.extend(["", "## Ruff format", fmt[:5000] or "No format output."])

          try:
              pyright = json.loads(Path("/tmp/pyright.json").read_text())
          except Exception as exc:
              pyright = {}
              lines.extend(["", f"BasedPyright JSON parse failed: {exc}", Path("/tmp/pyright.stderr").read_text(errors="replace")[:3000]])

          summary = pyright.get("summary", {})
          diagnostics = pyright.get("generalDiagnostics", [])
          lines.extend([
              "",
              "## BasedPyright",
              f"Errors: {summary.get('errorCount', 'unknown')}",
              f"Warnings: {summary.get('warningCount', 'unknown')}",
              f"Information: {summary.get('informationCount', 'unknown')}",
          ])
          by_rule = collections.Counter(d.get("rule") or "unknown" for d in diagnostics)
          by_file = collections.Counter(Path(d.get("file", "unknown")).as_posix() for d in diagnostics)
          lines.append("\nTop rules:")
          for key, count in by_rule.most_common(25):
              lines.append(f"- {key}: {count}")
          lines.append("\nTop files:")
          for key, count in by_file.most_common(30):
              lines.append(f"- {key}: {count}")
          lines.append("\nFirst diagnostics:")
          for d in diagnostics[:60]:
              start = d.get("range", {}).get("start", {})
              line = int(start.get("line", 0)) + 1
              msg = " ".join(str(d.get("message", "")).split())[:280]
              lines.append(f"- {d.get('file', 'unknown')}:{line} [{d.get('rule', 'unknown')}] {msg}")

          Path(".hardening/summary.txt").write_text("\n".join(lines) + "\n")
          PY
      - name: Commit diagnostics to the hardening branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .hardening/summary.txt
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
          else
            git commit -m "chore(hardening): refresh static-analysis summary"
            git push
          fi