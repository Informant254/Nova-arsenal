# Revival baseline: lint, formatting, typing, tests, client builds, and container builds are blocking gates.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, "revive/**", "revival/**"]
  pull_request:
    branches: [main, "revival/**"]

jobs:
  lint:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and lint tools
        run: pip install -e ".[dev]"
      - name: Check Python linting
        run: ruff check .
      - name: Check Python formatting
        run: ruff format --check .

  typecheck:
    name: Python Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and type checker
        run: pip install -e ".[dev]"
      - name: Run type checking
        run: basedpyright nova_arsenal/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short

  web-build:
    name: Web Client Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: clients/web
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: clients/web
        run: npm run build

  vscode-build:
    name: VS Code Extension Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      - name: Install dependencies
        working-directory: clients/vscode
        run: npm ci
      - name: Compile extension
        working-directory: clients/vscode
        run: npm run compile

  docker-build:
    name: Docker Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [agent, web, kali]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile.${{ matrix.image }}
          push: false
          tags: nova-${{ matrix.image }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, web-build, vscode-build, docker-build]
    steps:
      - name: Required checks passed
        run: echo "Required CI checks passed"
