name: Type Fix Batch

on:
  push:
    branches: ["release/hardening"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development tools
        run: pip install -e ".[dev]"
      - name: Apply second targeted type-fix batch
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "nova_arsenal/agent_runner.py": [
                  (
                      "            burp_issues=self._burp_issues,",
                      "            burp_issues=[issue.to_dict() for issue in self._burp_issues],",
                  ),
              ],
              "nova_arsenal/api/routes.py": [
                  ("    agent_id: int = None,", "    agent_id: int | None = None,"),
                  ("    severity: str = None,", "    severity: str | None = None,"),
                  (
                      '                "severity": finding.severity.value,',
                      '                "severity": finding.severity.value if finding.severity else None,',
                  ),
                  (
                      '        "severity": finding.severity.value,',
                      '        "severity": finding.severity.value if finding.severity else None,',
                  ),
                  ("    description: str = None,", "    description: str | None = None,"),
                  (
                      '                "severity": f.severity.value,',
                      '                "severity": f.severity.value if f.severity else None,',
                  ),
              ],
              "nova_arsenal/auth/oauth.py": [
                  (
                      '    try:\n        issued_at = int(payload.get("iat"))\n    except (TypeError, ValueError):\n        return False\n',
                      '    issued_at_value = payload.get("iat")\n    if issued_at_value is None:\n        return False\n    try:\n        issued_at = int(issued_at_value)\n    except (TypeError, ValueError):\n        return False\n',
                  ),
              ],
              "nova_arsenal/auth/routes.py": [
                  (
                      '    raw_user_id = payload.get("sub")\n    try:\n        user_id = int(raw_user_id)\n',
                      '    raw_user_id = payload.get("sub")\n    if raw_user_id is None:\n        raise HTTPException(\n            status_code=status.HTTP_401_UNAUTHORIZED,\n            detail="Invalid token subject",\n        )\n    try:\n        user_id = int(raw_user_id)\n',
                  ),
              ],
              "nova_arsenal/exploitation/attack_chaining.py": [
                  (
                      'ChainCallback = Callable[[AttackNode, tuple[bool, dict[str, Any]], dict[str, Any]], None]',
                      'ChainCallback = Callable[[AttackNode, tuple[bool, dict[str, Any]], dict[str, Any]], Any]',
                  ),
              ],
              "nova_arsenal/incremental/engine.py": [
                  (
                      "        all_tests: list[dict] | None = None,",
                      "        all_tests: list[dict[str, Any]] | None = None,",
                  ),
              ],
              "nova_arsenal/ransomware/emulator.py": [
                  (
                      "    duration_ms: float = 0.0\n    evidence: str = \"\"",
                      "    duration_ms: float = 0.0\n    start_time: float = 0.0\n    evidence: str = \"\"",
                  ),
                  (
                      "                action.duration_ms = (time.monotonic() - getattr(action, 'start_time', time.monotonic())) * 1000",
                      "                action.duration_ms = (time.monotonic() - action.start_time) * 1000",
                  ),
              ],
              "nova_arsenal/safety/controller.py": [
                  (
                      "import uuid\nfrom dataclasses import dataclass, field",
                      "import uuid\nfrom collections.abc import Callable\nfrom dataclasses import dataclass, field\nfrom typing import Any",
                  ),
                  (
                      "        self._approval_callbacks: dict[str, callable] = {}",
                      "        self._approval_callbacks: dict[str, Callable[..., Any]] = {}",
                  ),
              ],
              "nova_arsenal/sandbox_executor.py": [
                  (
                      "                    result = await self.execute_local(\n",
                      "                    result = await self._execute_local(\n",
                  ),
              ],
              "nova_arsenal/arch/mhc.py": [
                  ("import torch\n", "import torch  # type: ignore[reportMissingImports]\n"),
                  ("import torch.nn as nn\n", "import torch.nn as nn  # type: ignore[reportMissingImports]\n"),
                  ("import torch.nn.functional as F\n", "import torch.nn.functional as F  # type: ignore[reportMissingImports]\n"),
              ],
              "nova_arsenal/optimizers/muon.py": [
                  ("import torch\n", "import torch  # type: ignore[reportMissingImports]\n"),
                  (
                      "from torch.optim.optimizer import Optimizer\n",
                      "from torch.optim.optimizer import Optimizer  # type: ignore[reportMissingImports]\n",
                  ),
              ],
              "nova_arsenal/mcp/server.py": [
                  (
                      "try:\n    from mcp import MCPServer, Resource, Tool\n    MCP_AVAILABLE = True\nexcept ImportError:\n    MCP_AVAILABLE = False\n",
                      "MCPServer: Any = None\nResource: Any = None\nTool: Any = None\n\ntry:\n    import mcp as _mcp\n\n    MCPServer = getattr(_mcp, \"MCPServer\", None)\n    Resource = getattr(_mcp, \"Resource\", None)\n    Tool = getattr(_mcp, \"Tool\", None)\n    MCP_AVAILABLE = all(item is not None for item in (MCPServer, Resource, Tool))\nexcept ImportError:\n    MCP_AVAILABLE = False\n",
                  ),
                  (
                      "        self._mcp_server = MCPServer(\n            name=\"nova-arsenal\",\n            version=\"1.0.0\",\n            tools=mcp_tools,\n            resources=mcp_resources,\n            handler=self.handle_tool_call,\n        )\n        await self._mcp_server.run()",
                      "        server = MCPServer(\n            name=\"nova-arsenal\",\n            version=\"1.0.0\",\n            tools=mcp_tools,\n            resources=mcp_resources,\n            handler=self.handle_tool_call,\n        )\n        self._mcp_server = server\n        await server.run()",
                  ),
              ],
              "nova_arsenal/zeroday/pipeline.py": [
                  (
                      "                p = meta.get(\"port\") or meta.get(\"ports\") or 0\n                if isinstance(p, list) and p:\n                    port = int(p[0]) if str(p[0]).isdigit() else 0\n                elif str(p).isdigit():\n                    port = int(p)\n            elif isinstance(meta, list) and meta:\n                port = int(meta[0]) if str(meta[0]).isdigit() else 0",
                      "                p = meta.get(\"port\") or meta.get(\"ports\") or 0\n                candidate = p[0] if isinstance(p, list) and p else p\n                if isinstance(candidate, (int, str)) and str(candidate).isdigit():\n                    port = int(candidate)\n            elif isinstance(meta, list) and meta:\n                candidate = meta[0]\n                if isinstance(candidate, (int, str)) and str(candidate).isdigit():\n                    port = int(candidate)",
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {filename}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

          ruff check . --fix
          git diff --check
          pytest -q
      - name: Capture type-check snapshot
        shell: bash
        run: |
          set +e
          mkdir -p .hardening
          basedpyright nova_arsenal/ --outputjson > /tmp/pyright.json 2>/tmp/pyright.stderr
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/pyright.json').read_text())
          summary = data.get('summary', {})
          diagnostics = data.get('generalDiagnostics', [])
          lines = [
              '# Targeted type-fix batch',
              '',
              f"Errors: {summary.get('errorCount', 'unknown')}",
              f"Warnings: {summary.get('warningCount', 'unknown')}",
              '',
          ]
          for d in diagnostics:
              start = d.get('range', {}).get('start', {})
              line = int(start.get('line', 0)) + 1
              msg = ' '.join(str(d.get('message', '')).split())[:300]
              lines.append(f"- {d.get('file', 'unknown')}:{line} [{d.get('rule', 'unknown')}] {msg}")
          Path('.hardening/type-batch.txt').write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit tested fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(hardening): resolve remaining static type issues"
          git push
